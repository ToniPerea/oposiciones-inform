@if (visible()) {
  <div
    class="fixed bottom-4 right-4 z-40 max-w-xs bg-white rounded-xl shadow-2xl border border-gray-200 p-4 flex items-start gap-3 animate-slide-up-fade-in"
  >
    <span class="text-2xl shrink-0" aria-hidden="true">📸</span>

    <div class="flex-1 min-w-0">
      <p class="text-sm font-semibold text-gray-900">¡Síguenos en Instagram!</p>
      <p class="text-xs text-gray-500 mt-0.5">Entérate de todas las novedades de EDUCOEF.</p>
      <a
        [href]="instagramUrl"
        target="_blank"
        rel="noopener noreferrer"
        (click)="dismiss()"
        class="inline-block mt-2 text-xs font-semibold text-white bg-gradient-to-r from-accent-500 to-primary-600 hover:opacity-90 transition-opacity duration-200 px-3 py-1.5 rounded-lg"
      >
        Seguir @educoef
      </a>
    </div>

    <button
      (click)="dismiss()"
      type="button"
      aria-label="Cerrar"
      class="shrink-0 text-gray-400 hover:text-gray-600 transition-colors duration-200 cursor-pointer"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
}
